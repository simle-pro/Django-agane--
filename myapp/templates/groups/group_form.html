{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% if group %}Редактировать группу{% else %}Создать группу{% endif %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'student_list' %}">Студенты</a>
        <a href="{% url 'group_list' %}">Группы</a>
    </nav>

    <div class="container">
        <h1>{% if group %}Редактировать группу{% else %}Создать группу{% endif %}</h1>

        <form method="post">
            {% csrf_token %}
            
            <label>Название группы:</label>
            <input type="text" name="name" value="{{ group.name }}" placeholder="Например: Python Backend" required>

            <label>Аудитория:</label>
            <input type="text" name="room" value="{{ group.room }}" placeholder="Например: Аудитория 302" required>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Сохранить</button>
        </form>

        <a href="{% url 'group_list' %}" class="back-link">← Назад к списку групп</a>
    </div>
</body>
</html>
